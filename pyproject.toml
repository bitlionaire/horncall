[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "horncall"
dynamic = ["version"]
description = "Approve AI coding agents' permission requests (Claude Code, Gemini CLI, Copilot CLI, Codex CLI) from your Android phone."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "bitlionaire", email = "bitlionaire.me@gmail.com" }]
keywords = ["claude-code", "gemini-cli", "copilot-cli", "codex", "permissions", "hooks", "android", "approval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = ["cryptography>=42", "qrcode>=7.4"]

[project.urls]
Homepage = "https://horncall.bitlionaire.me"
Source = "https://github.com/bitlionaire/horncall"
Issues = "https://github.com/bitlionaire/horncall/issues"

[project.scripts]
horncall = "approver.entry:main"

[tool.setuptools]
package-dir = { "" = "plugin" }
packages = ["approver"]

[tool.setuptools.dynamic]
version = { attr = "approver.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
